<!DOCTYPE html>
<html lang="es">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APEX Card Grading | Certificado</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      color: #fff;
      background: linear-gradient(180deg, #08090d, #0d1017);
    }

    /* HEADER */
    .main-header {
      width: 100%;
      padding: 20px 40px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      color: white;
      text-decoration: none;
    }

    /* LAYOUT */
    .verify-page {
      max-width: 1400px;
      margin: auto;
      padding: 40px 20px;
    }

    .verify-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .panel {
      border-radius: 30px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* CARTA */
    .visual-panel {
      min-height: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .visual-panel img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scale(1.05);
      filter: drop-shadow(0 40px 100px rgba(0,0,0,0.8));
    }

    /* INFO */
    .content-panel {
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 2px;
      color: #aaa;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .card-title {
      font-size: 60px;
      font-weight: 900;
      margin: 0;
      line-height: 1;
    }

    .card-meta {
      margin-top: 10px;
      color: #ccc;
    }

    /* GRADE */
    .grade-box {
      padding: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      text-align: center;
      min-width: 220px;
    }

    .grade-label {
      font-size: 12px;
      color: #aaa;
    }

    .grade-value {
      font-size: 48px;
      font-weight: 900;
    }

    /* META */
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .meta-card {
      padding: 15px;
      border-radius: 15px;
      background: rgba(255,255,255,0.04);
    }

    /* SUBGRADES */
    .subgrades-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .subgrade-card {
      text-align: center;
      padding: 15px;
      border-radius: 15px;
      background: rgba(255,255,255,0.04);
    }

    .subgrade-value {
      font-size: 32px;
      font-weight: 900;
    }

    /* TEXT */
    .text-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .text-card {
      padding: 20px;
      border-radius: 15px;
      background: rgba(255,255,255,0.04);
    }

    @media (max-width: 900px) {
      .verify-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="main-header">
  <a href="index.html" class="logo">HOME</a>
</header>

<main class="verify-page">
  <div id="certContainer">Cargando...</div>
</main>

<script src="data.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const container = document.getElementById("certContainer");

if (!id || !window.certificates || !window.certificates[id]) {
  container.innerHTML = "<h1>Certificado no encontrado</h1>";
} else {

  const cert = window.certificates[id];

  container.innerHTML = `
    <div class="verify-layout">

      <div class="panel visual-panel">
        <img src="${cert.image}">
      </div>

      <div class="panel content-panel">

        <div class="eyebrow">OFFICIAL CERTIFICATE RECORD</div>

        <div class="title-row">
          <div>
            <h1 class="card-title">${cert.cardDetails.name}</h1>
            <div class="card-meta">
              ${cert.cardDetails.year} ${cert.cardDetails.brand}<br>
              ${cert.cardDetails.set}<br>
              ${cert.cardDetails.number}
            </div>
          </div>

          <div class="grade-box">
            <div class="grade-label">FINAL GRADE</div>
            <div class="grade-value">${cert.finalGrade}</div>
            <div>Average ${cert.averageScore}</div>
          </div>
        </div>

        <div class="meta-grid">
          <div class="meta-card">
            <b>CERTIFICATE ID</b><br>
            ${cert.certificateId}
          </div>

          <div class="meta-card">
            <b>STATUS</b><br>
            ${cert.status}
          </div>
        </div>

        <div class="subgrades-grid">
          <div class="subgrade-card">
            Surface<br><span class="subgrade-value">${cert.subgrades.surface}</span>
          </div>
          <div class="subgrade-card">
            Corners<br><span class="subgrade-value">${cert.subgrades.corners}</span>
          </div>
          <div class="subgrade-card">
            Edges<br><span class="subgrade-value">${cert.subgrades.edges}</span>
          </div>
          <div class="subgrade-card">
            Centering<br><span class="subgrade-value">${cert.subgrades.centering}</span>
          </div>
        </div>

        <div class="text-grid">
          <div class="text-card">
            <b>Technical Assessment</b><br><br>
            ${cert.technicalAssessment}
          </div>

          <div class="text-card">
            <b>Security Notice</b><br><br>
            ${cert.securityNotice}
          </div>
        </div>

      </div>

    </div>
  `;
}
</script>

</body>
</html>
