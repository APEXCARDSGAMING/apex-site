  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://szhiimrrajvifumwkfpk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gRlfE1ScPrVD-XKO1A_mWA_M1tcOKD7";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const params = new URLSearchParams(window.location.search);
    const id = (params.get("id") || "").trim().toUpperCase();
    const container = document.getElementById("certContainer");

    function safeText(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatValue(value, fallback = "-") {
      if (value === null || value === undefined || value === "") return fallback;
      return value;
    }

    function metricFromString(value) {
      const text = String(value || "").trim();
      if (!text) return null;
      const parts = text.split(/\s+/);
      if (parts.length === 1) return { label: parts[0], value: "" };
      return { label: parts.slice(0, -1).join(" "), value: parts[parts.length - 1] };
    }

    function normalizeMetrics(metrics) {
      if (!Array.isArray(metrics)) return [];
      return metrics.map(metric => {
        if (!metric) return null;
        if (typeof metric === "string") return metricFromString(metric);
        return { label: metric.label || metric.name || "", value: metric.value || metric.score || "" };
      }).filter(item => item && (item.label || item.value));
    }

    function normalizeItem(item, fallbackTitle) {
      if (!item) return null;
      if (typeof item === "string") return { src: item, title: fallbackTitle || "CAPTURA", score: "", metrics: [], defects: [] };
      const src = item.src || item.url || item.image_url || "";
      if (!src) return null;
      return {
        src,
        title: item.title || item.label || fallbackTitle || "CAPTURA",
        score: item.score ?? "",
        overlays: item.overlays || { hLine: true, vLine: true },
        metrics: normalizeMetrics(item.metrics),
        defects: Array.isArray(item.defects) ? item.defects.filter(Boolean) : [],
        filename: item.filename || ""
      };
    }

    function getByTitle(items, title) {
      if (!Array.isArray(items)) return null;
      const normalizedTitle = String(title).toUpperCase();
      return items.find(item => String(item.title || item.filename || "").toUpperCase().includes(normalizedTitle)) || null;
    }

    function legacyFromAnalysisImages(value, cert) {
      if (!value) return {};
      if (typeof value === "string") {
        try { value = JSON.parse(value); } catch (error) { return {}; }
      }

      if (value.zoomImages || value.centeringImages || value.edgeImages || value.microscopeImages || value.compareImages) {
        return value;
      }

      const legacy = {
        folder_name: value.folder_name || null,
        summary: value.summary || {},
        centeringImages: {},
        zoomImages: { front: {}, back: {} },
        microscopeImages: [],
        edgeImages: { front: {}, back: {} },
        compareImages: { front: { original: "", filtered: "" }, back: { original: "", filtered: "" } },
        other: value.other || []
      };

      const main = value.main || {};
      const centering = value.centering || {};
      legacy.centeringImages.front = (centering.front && centering.front[0] && (centering.front[0].url || centering.front[0].src)) || (main.front && (main.front.url || main.front.src)) || cert.frontImage || "";
      legacy.centeringImages.back = (centering.back && centering.back[0] && (centering.back[0].url || centering.back[0].src)) || (main.back && (main.back.url || main.back.src)) || cert.backImage || "";


      const compare = value.compare || value.compareImages || value.surfaceCompare || {};
      const filtered = value.filtered || {};
      legacy.compareImages.front.original = (compare.front && (compare.front.original || compare.front.base || compare.front.color)) || "";
      legacy.compareImages.front.filtered = (compare.front && (compare.front.filtered || compare.front.overlay || compare.front.defects)) || "";
      legacy.compareImages.back.original = (compare.back && (compare.back.original || compare.back.base || compare.back.color)) || "";
      legacy.compareImages.back.filtered = (compare.back && (compare.back.filtered || compare.back.overlay || compare.back.defects)) || "";

      const corners = value.corners || {};
      ["front", "back"].forEach(side => {
        const list = corners[side] || [];
        legacy.zoomImages[side].topLeft = normalizeItem(getByTitle(list, "TOP LEFT"), "TOP LEFT");
        legacy.zoomImages[side].topRight = normalizeItem(getByTitle(list, "TOP RIGHT"), "TOP RIGHT");
        legacy.zoomImages[side].bottomLeft = normalizeItem(getByTitle(list, "BOTTOM LEFT"), "BOTTOM LEFT");
        legacy.zoomImages[side].bottomRight = normalizeItem(getByTitle(list, "BOTTOM RIGHT"), "BOTTOM RIGHT");
      });

      const edges = value.edges || {};
      ["front", "back"].forEach(side => {
        const list = edges[side] || [];
        legacy.edgeImages[side].top = normalizeItem(getByTitle(list, "TOP"), "TOP");
        legacy.edgeImages[side].bottom = normalizeItem(getByTitle(list, "BOTTOM"), "BOTTOM");
        legacy.edgeImages[side].left = normalizeItem(getByTitle(list, "LEFT"), "LEFT");
        legacy.edgeImages[side].right = normalizeItem(getByTitle(list, "RIGHT"), "RIGHT");
      });

      legacy.microscopeImages = (value.microscope || []).map(item => normalizeItem(item)).filter(Boolean);
      return legacy;
    }

    function mapSupabaseCertificate(row) {
      const cert = {
        certificateId: row.certificate_id,
        status: row.status || "Verified Authentic",
        finalGrade: row.final_grade || "En proceso",
        averageScore: row.average_score ?? "-",
        image: row.slab_image_url || row.front_image_url || row.back_image_url || "",
        video: row.video_url || "",
        frontImage: row.front_image_url || "",
        backImage: row.back_image_url || "",
        compareImages: {
          front: { original: "", filtered: "" },
          back: { original: "", filtered: "" }
        },
        cardDetails: {
          name: row.card_name || "Carta sin nombre",
          year: row.card_year || "",
          brand: row.brand || "",
          set: row.set_name || "",
          number: row.card_number || "",
          variant: row.variant || ""
        },
        subgrades: {
          surface: row.surface ?? "-",
          corners: row.corners ?? "-",
          edges: row.edges ?? "-",
          centering: row.centering ?? "-"
        },
        technicalAssessment: row.technical_assessment || "El análisis técnico todavía no fue cargado para este certificado.",
        securityNotice: row.security_notice || "This certificate is registered in the official APEX Card Grading database."
      };

      const legacy = legacyFromAnalysisImages(row.analysis_images, cert);
      return Object.assign(cert, legacy);
    }

    function renderNotFound(message) {
      container.innerHTML = `
        <div class="not-found">
          <h1>Certificado no encontrado</h1>
          <p>${safeText(message || "Revisá que el código ingresado sea correcto o volvé al buscador principal.")}</p>
        </div>
      `;
    }

    function renderCentering(cert){
      if (!cert.centeringImages || (!cert.centeringImages.front && !cert.centeringImages.back)) return "";

      return `
        <section class="panel section-block">
          <h2 class="section-title">Análisis de centrado</h2>
          <div class="centering-grid">
            ${cert.centeringImages.front ? `
              <div class="centering-card">
                <img src="${safeText(cert.centeringImages.front)}" alt="Centering frente">
                <span>Frente</span>
              </div>` : ""}
            ${cert.centeringImages.back ? `
              <div class="centering-card">
                <img src="${safeText(cert.centeringImages.back)}" alt="Centering dorso">
                <span>Dorso</span>
              </div>` : ""}
          </div>
        </section>
      `;
    }

    function renderDetailBlock(item, type){
      const metrics = (item.metrics || [])
        .map(metric => `<span class="${type}-metric analysis-metric-chip"><small>${safeText(metric.label)}</small><b>${safeText(metric.value)}</b></span>`)
        .join("");

      const defects = (item.defects || [])
        .map(defect => `<span class="${type}-defect analysis-note-chip">${safeText(defect)}</span>`)
        .join("");

      return `
        <div class="analysis-detail-panel">
          <div class="analysis-detail-row">
            <span class="analysis-detail-label">FRAY / FILL / ANGLE</span>
            <div class="analysis-detail-chips analysis-metrics-list">
              ${metrics || `<span class="analysis-empty-chip">Sin métricas cargadas</span>`}
            </div>
          </div>
          <div class="analysis-detail-row">
            <span class="analysis-detail-label">NOTAS</span>
            <div class="analysis-detail-chips analysis-notes-list">
              ${defects || `<span class="analysis-empty-chip no-defects">NO DEFECTS</span>`}
            </div>
          </div>
        </div>
      `;
    }

    function renderCornerCard(corner, fallbackTitle) {
      const item = normalizeItem(corner, fallbackTitle);
      if (!item) return "";

      return `
        <div class="corner-analysis-card">
          <div class="corner-image-wrap">
            <img src="${safeText(item.src)}" alt="${safeText(item.title || fallbackTitle)}">
            <div class="corner-topbar analysis-topbar">
              ${item.score !== "" ? `<span class="corner-score analysis-score-badge">${safeText(item.score)}</span>` : `<span class="corner-score analysis-score-badge muted">—</span>`}
              <span class="corner-title analysis-title-badge">${safeText(item.title || fallbackTitle)}</span>
            </div>
          </div>
          ${renderDetailBlock(item, "corner")}
        </div>
      `;
    }

    function renderZoomSection(cert){
      if (!cert.zoomImages) return "";
      const front = cert.zoomImages.front || {};
      const back = cert.zoomImages.back || {};
      const hasFront = front.topLeft || front.topRight || front.bottomLeft || front.bottomRight;
      const hasBack = back.topLeft || back.topRight || back.bottomLeft || back.bottomRight;
      if (!hasFront && !hasBack) return "";

      return `
        <section class="panel section-block">
          <h2 class="section-title">Zoom de esquinas</h2>
          <div class="zoom-group">
            ${hasFront ? `
              <div>
                <p class="zoom-subtitle">Frente</p>
                <div class="zoom-grid">
                  ${renderCornerCard(front.topLeft, "TOP LEFT")}
                  ${renderCornerCard(front.topRight, "TOP RIGHT")}
                  ${renderCornerCard(front.bottomLeft, "BOTTOM LEFT")}
                  ${renderCornerCard(front.bottomRight, "BOTTOM RIGHT")}
                </div>
              </div>` : ""}
            ${hasBack ? `
              <div>
                <p class="zoom-subtitle">Reverso</p>
                <div class="zoom-grid">
                  ${renderCornerCard(back.topLeft, "TOP LEFT")}
                  ${renderCornerCard(back.topRight, "TOP RIGHT")}
                  ${renderCornerCard(back.bottomLeft, "BOTTOM LEFT")}
                  ${renderCornerCard(back.bottomRight, "BOTTOM RIGHT")}
                </div>
              </div>` : ""}
          </div>
        </section>
      `;
    }

    function renderMicroscopeCard(item) {
      const normalized = normalizeItem(item, "DETAIL");
      if (!normalized) return "";

      return `
        <div class="micro-analysis-card">
          <div class="micro-image-wrap">
            <img src="${safeText(normalized.src)}" alt="${safeText(normalized.title)}">
            <div class="micro-topbar analysis-topbar">
              ${normalized.score !== "" ? `<span class="micro-score analysis-score-badge">${safeText(normalized.score)}</span>` : `<span class="micro-score analysis-score-badge muted">—</span>`}
              <span class="micro-title analysis-title-badge">${safeText(normalized.title)}</span>
            </div>
          </div>
          ${renderDetailBlock(normalized, "micro")}
        </div>
      `;
    }

    function renderMicroscopeSection(cert){
      if (!cert.microscopeImages || !cert.microscopeImages.length) return "";
      return `
        <section class="panel section-block">
          <h2 class="section-title">Capturas de microscopio</h2>
          <div class="micro-grid">
            ${cert.microscopeImages.map(item => renderMicroscopeCard(item)).join("")}
          </div>
        </section>
      `;
    }

    function renderEdgeCard(edge, fallbackTitle) {
      const normalized = normalizeItem(edge, fallbackTitle);
      if (!normalized) return "";

      return `
        <div class="edge-analysis-card">
          <div class="edge-image-wrap">
            <img src="${safeText(normalized.src)}" alt="${safeText(normalized.title || fallbackTitle)}">
            <div class="edge-topbar analysis-topbar">
              ${normalized.score !== "" ? `<span class="edge-score analysis-score-badge">${safeText(normalized.score)}</span>` : `<span class="edge-score analysis-score-badge muted">—</span>`}
              <span class="edge-title analysis-title-badge">${safeText(normalized.title || fallbackTitle)}</span>
            </div>
          </div>
          ${renderDetailBlock(normalized, "edge")}
        </div>
      `;
    }

    function renderEdgesSection(cert) {
      if (!cert.edgeImages) return "";
      const front = cert.edgeImages.front || {};
      const back = cert.edgeImages.back || {};
      const hasFront = front.top || front.bottom || front.left || front.right || front.topLeft || front.topRight || front.bottomLeft || front.bottomRight;
      const hasBack = back.top || back.bottom || back.left || back.right || back.topLeft || back.topRight || back.bottomLeft || back.bottomRight;
      if (!hasFront && !hasBack) return "";

      return `
        <section class="panel section-block">
          <h2 class="section-title">Análisis de bordes</h2>
          <div class="zoom-group">
            ${hasFront ? `
              <div>
                <p class="zoom-subtitle">Front Edges</p>
                <div class="edge-grid">
                  ${renderEdgeCard(front.top || front.topLeft, "TOP")}
                  ${renderEdgeCard(front.bottom || front.bottomLeft, "BOTTOM")}
                  ${renderEdgeCard(front.left, "LEFT")}
                  ${renderEdgeCard(front.right, "RIGHT")}
                </div>
              </div>` : ""}
            ${hasBack ? `
              <div>
                <p class="zoom-subtitle">Back Edges</p>
                <div class="edge-grid">
                  ${renderEdgeCard(back.top || back.topLeft, "TOP")}
                  ${renderEdgeCard(back.bottom || back.bottomLeft, "BOTTOM")}
                  ${renderEdgeCard(back.left, "LEFT")}
                  ${renderEdgeCard(back.right, "RIGHT")}
                </div>
              </div>` : ""}
          </div>
        </section>
      `;
    }

    function renderCompareCard(title, originalSrc, filteredSrc, originalAlt, filteredAlt){
      if (!originalSrc || !filteredSrc) return "";
      return `
        <div class="vision-compare-card">
          <div class="image-compare verify-image-compare" data-compare-box>
            <img src="${safeText(originalSrc)}" alt="${safeText(originalAlt)}" class="compare-base" />
            <img src="${safeText(filteredSrc)}" alt="${safeText(filteredAlt)}" class="compare-top" />
            <div class="compare-divider"><span class="compare-handle"></span></div>
            <div class="compare-tag compare-tag-left">Full Color</div>
            <div class="compare-tag compare-tag-right">ACG Vision</div>
          </div>
          <span class="compare-card-label">${safeText(title)}</span>
        </div>
      `;
    }

    function renderCompareSection(cert){
      const compare = cert.compareImages || {};
      const frontOriginal = (compare.front && compare.front.original) || "";
      const frontFiltered = (compare.front && compare.front.filtered) || "";
      const backOriginal = (compare.back && compare.back.original) || "";
      const backFiltered = (compare.back && compare.back.filtered) || "";
      if ((!frontOriginal || !frontFiltered) && (!backOriginal || !backFiltered)) return "";

      return `
        <section class="panel section-block">
          <p class="process-visual-label">Comparación visual</p>
          <h2 class="section-title">Full Color vs análisis técnico</h2>
          <p class="compare-section-copy">Deslizá el divisor para comparar la carta original con la versión analizada mediante filtro técnico.</p>
          <div class="centering-grid compare-grid">
            ${renderCompareCard("Frente", frontOriginal, frontFiltered, `${cert.cardDetails.name} frente original`, `${cert.cardDetails.name} frente con filtro técnico`)}
            ${renderCompareCard("Dorso", backOriginal, backFiltered, `${cert.cardDetails.name} dorso original`, `${cert.cardDetails.name} dorso con filtro técnico`)}
          </div>
        </section>
      `;
    }

    function initCompareSliders(){
      document.querySelectorAll('[data-compare-box]').forEach(compareBox => {
        const compareTop = compareBox.querySelector('.compare-top');
        const compareDivider = compareBox.querySelector('.compare-divider');
        if (!compareTop || !compareDivider) return;

        let isDragging = false;

        function updateCompare(clientX) {
          const rect = compareBox.getBoundingClientRect();
          let position = ((clientX - rect.left) / rect.width) * 100;
          position = Math.max(0, Math.min(100, position));
          compareDivider.style.left = `${position}%`;
          compareTop.style.clipPath = `inset(0 0 0 ${position}%)`;
        }

        function startDrag(clientX) {
          isDragging = true;
          updateCompare(clientX);
        }

        function stopDrag() {
          isDragging = false;
        }

        compareBox.addEventListener('mousedown', event => startDrag(event.clientX));
        window.addEventListener('mousemove', event => {
          if (isDragging) updateCompare(event.clientX);
        });
        window.addEventListener('mouseup', stopDrag);

        compareBox.addEventListener('touchstart', event => {
          if (!event.touches.length) return;
          startDrag(event.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('touchmove', event => {
          if (!isDragging || !event.touches.length) return;
          updateCompare(event.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('touchend', stopDrag);

        compareDivider.style.left = '50%';
        compareTop.style.clipPath = 'inset(0 0 0 50%)';
      });
    }

    function renderSummarySection(cert) {
      const summary = cert.summary || {};
      const items = [
        ["Centering", cert.subgrades.centering, summary.centering || "Your card's centering has been reviewed through the APEX visual alignment process, comparing border balance and overall positioning on both sides of the card.", "↔"],
        ["Corners", cert.subgrades.corners, summary.corners || "Corner condition is evaluated through close-up inspection of all four front corners and all four back corners, looking for whitening, rounding, fraying, and corner touches.", "○"],
        ["Edges", cert.subgrades.edges, summary.edges || "Edges are reviewed across the top, bottom, left, and right sides of the card, checking for chipping, notches, fraying, dents, and surface wear.", "≡"],
        ["Surface", cert.subgrades.surface, summary.surface || cert.technicalAssessment || "Surface condition is evaluated through visual inspection and filtered captures to detect scratches, print defects, scuffing, pitting, and other surface-level imperfections.", "✎"]
      ];
      return `
        <section class="panel section-block summary-block">
          <h2 class="section-title">ZONE ANALYSIS</h2>
          <div class="summary-grid">
            ${items.map(([title, score, text, icon]) => `
              <div class="summary-card zone-card">
                <div class="summary-card-head zone-card-head"><b>${safeText(title)}</b></div>
                <p>${safeText(text || "Summary pending.")}</p>
                ${title === "Centering" && cert.centering_ratios ? `<div class="zone-ratios">${safeText(cert.centering_ratios)}</div>` : ""}
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }


    function gradeNumber(value) {
      const parsed = parseFloat(String(value ?? "").replace(",", "."));
      if (Number.isNaN(parsed)) return null;
      return Math.max(0, Math.min(10, parsed));
    }

    function renderGradeBreakdown(cert) {
      const rows = [
        ["Surface", cert.subgrades.surface],
        ["Corners", cert.subgrades.corners],
        ["Edges", cert.subgrades.edges],
        ["Centering", cert.subgrades.centering]
      ];

      return `
        <section class="panel section-block grade-breakdown-block">
          <div class="grade-breakdown-head">
            <div>
              <h2 class="section-title">Resumen final de notas</h2>
              <p>Lectura rápida del resultado APEX: nota final, promedio y subgrades principales.</p>
            </div>
            <div class="grade-breakdown-final">
              <span>Final Grade</span>
              <strong>${safeText(cert.finalGrade)}</strong>
              <small>Average ${safeText(cert.averageScore)}</small>
            </div>
          </div>

          <div class="grade-breakdown-grid">
            ${rows.map(([label, value]) => {
              const numeric = gradeNumber(value);
              const percent = numeric === null ? 0 : numeric * 10;
              return `
                <article class="grade-breakdown-card">
                  <div class="grade-breakdown-row">
                    <span>${safeText(label)}</span>
                    <strong>${safeText(value)}</strong>
                  </div>
                  <div class="grade-breakdown-bar" aria-label="${safeText(label)} ${safeText(value)} sobre 10">
                    <span style="width:${percent}%"></span>
                  </div>
                </article>
              `;
            }).join("")}
          </div>
        </section>
      `;
    }

    function normalizePopValue(value){
      return String(value ?? "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ");
    }

    function popNumber(value){
      const parsed = parseFloat(String(value ?? "").replace(",", "."));
      return Number.isFinite(parsed) ? parsed : null;
    }

    function rankingScore(row){
      const avg = popNumber(row.average_score);
      if (avg !== null) return avg;
      const gradeMatch = String(row.final_grade || "").match(/\d+(?:[\.,]\d+)?/);
      return gradeMatch ? popNumber(gradeMatch[0]) : 0;
    }

    function sameCardKeyFromCert(cert){
      return [
        cert.cardDetails.name,
        cert.cardDetails.year,
        cert.cardDetails.brand,
        cert.cardDetails.set,
        cert.cardDetails.number,
        cert.cardDetails.variant
      ].map(normalizePopValue).join("|");
    }

    function sameCardKeyFromRow(row){
      return [
        row.card_name,
        row.card_year,
        row.brand,
        row.set_name,
        row.card_number,
        row.variant
      ].map(normalizePopValue).join("|");
    }

    function renderPopReport(report){
      const box = document.getElementById("popReportBox");
      if (!box || !report) return;
      box.classList.remove("hidden");
      box.innerHTML = `
        <div class="pop-report-top">
          <span>APEX Pop Report</span>
          <strong>#${safeText(report.rank)} / ${safeText(report.population)}</strong>
        </div>
        <div class="pop-report-sub">Same card ranking</div>
        <div class="pop-report-stats">
          <div><small>POP</small><b>${safeText(report.population)}</b></div>
          <div><small>Highest</small><b>${safeText(report.highestGrade)}</b></div>
          <div><small>AVG</small><b>${safeText(report.averageScore)}</b></div>
        </div>
      `;
    }

    async function loadPopReport(cert){
      try {
        const { data, error } = await supabaseClient
          .from("certificates")
          .select("certificate_id, final_grade, average_score, card_name, card_year, brand, set_name, card_number, variant, public_visible")
          .eq("public_visible", true)
          .limit(5000);

        if (error) {
          console.warn("No pude cargar pop report", error);
          return;
        }

        const targetKey = sameCardKeyFromCert(cert);
        const rows = (data || []).filter(row => sameCardKeyFromRow(row) === targetKey);
        if (!rows.length) return;

        const current = rows.find(row => normalizePopValue(row.certificate_id) === normalizePopValue(cert.certificateId)) || rows[0];
        const currentScore = rankingScore(current);
        const betterCount = rows.filter(row => rankingScore(row) > currentScore).length;
        const rank = betterCount + 1;
        const scores = rows.map(rankingScore);
        const highestScore = Math.max(...scores);
        const highestRow = rows.find(row => rankingScore(row) === highestScore) || rows[0];
        const average = scores.reduce((sum, score) => sum + score, 0) / scores.length;

        renderPopReport({
          rank,
          population: rows.length,
          highestGrade: highestRow.final_grade || highestScore.toFixed(2),
          averageScore: average.toFixed(2).replace(".00", "")
        });
      } catch (error) {
        console.warn("No pude cargar pop report", error);
      }
    }

    function renderRegisteredOwner(owner){
      const box = document.getElementById("registeredOwnerBox");
      if (!box || !owner) return;
      const name = owner.display_name || owner.username || "Collector";
      const username = owner.username || "";
      box.classList.remove("hidden");
      box.innerHTML = `
        <div>
          <span>Registered Collector</span>
          <strong>${safeText(name)}</strong>
        </div>
        ${username ? `<a href="collector.html?user=${encodeURIComponent(username)}" class="owner-link">Ver colección</a>` : ""}
      `;
    }

    async function loadRegisteredOwner(certificateId){
      try {
        const { data, error } = await supabaseClient.rpc("get_public_certificate_owner", {
          p_certificate_id: certificateId
        });
        if (error) {
          console.warn("No pude cargar dueño público", error);
          return;
        }
        const owner = Array.isArray(data) ? data[0] : data;
        if (owner) renderRegisteredOwner(owner);
      } catch (error) {
        console.warn("No pude cargar dueño público", error);
      }
    }

    function renderCertificate(cert) {
      const cardYear = formatValue(cert.cardDetails.year, "");
      const cardBrand = formatValue(cert.cardDetails.brand, "");
      const cardSet = formatValue(cert.cardDetails.set, "");
      const cardNumber = formatValue(cert.cardDetails.number, "");
      const cardVariant = formatValue(cert.cardDetails.variant, "");

      container.innerHTML = `
        <div class="verify-status">${safeText(cert.status)}</div>
        <div class="verify-layout">
          <div class="visual-stack">
            <div class="panel visual-panel">
              ${cert.video
                ? `<video src="${safeText(cert.video)}" autoplay muted loop playsinline></video>`
                : cert.image
                  ? `<img src="${safeText(cert.image)}" alt="${safeText(cert.cardDetails.name)}">`
                  : `<div class="image-placeholder">Imagen del slab pendiente de carga.</div>`
              }
            </div>

            <div class="certificate-insights-grid certificate-insights-side">
              <div id="popReportBox" class="pop-report-box hidden"></div>
              <div id="registeredOwnerBox" class="registered-owner-box hidden"></div>
            </div>
          </div>

          <div class="panel content-panel">
            <div class="eyebrow">Official Certificate Record</div>
            <div class="title-row">
              <div>
                <h1 class="card-title">${safeText(cert.cardDetails.name)}</h1>
                <div class="card-meta">
                  ${safeText(cardYear)} ${safeText(cardBrand)}<br>
                  ${safeText(cardSet)}${cardVariant ? `<br>${safeText(cardVariant)}` : ""}<br>
                  ${safeText(cardNumber)}
                </div>
              </div>
              <div class="grade-box">
                <div class="grade-label">Final Grade</div>
                <div class="grade-value">${safeText(cert.finalGrade)}</div>
                <div class="grade-average">Average ${safeText(cert.averageScore)}</div>
              </div>
            </div>

            <div class="meta-grid">
              <div class="meta-card"><b>Certificate ID</b>${safeText(cert.certificateId)}</div>
              <div class="meta-card"><b>Status</b>${safeText(cert.status)}</div>
            </div>

            <div class="subgrades-grid">
              <div class="subgrade-card"><span class="subgrade-label">Surface</span><span class="subgrade-value">${safeText(cert.subgrades.surface)}</span></div>
              <div class="subgrade-card"><span class="subgrade-label">Corners</span><span class="subgrade-value">${safeText(cert.subgrades.corners)}</span></div>
              <div class="subgrade-card"><span class="subgrade-label">Edges</span><span class="subgrade-value">${safeText(cert.subgrades.edges)}</span></div>
              <div class="subgrade-card"><span class="subgrade-label">Centering</span><span class="subgrade-value">${safeText(cert.subgrades.centering)}</span></div>
            </div>

            <div class="text-grid">
              <div class="text-card"><b>Technical Assessment</b>${safeText(cert.technicalAssessment)}</div>
              <div class="text-card"><b>Security Notice</b>${safeText(cert.securityNotice)}</div>
            </div>
          </div>
        </div>

        ${renderCentering(cert)}
        ${renderZoomSection(cert)}
        ${renderMicroscopeSection(cert)}
        ${renderEdgesSection(cert)}
        ${renderCompareSection(cert)}
        ${renderSummarySection(cert)}
        
      `;
      initCompareSliders();
      loadPopReport(cert);
      loadRegisteredOwner(cert.certificateId);
    }

    async function loadCertificate() {
      if (!id) {
        renderNotFound("Falta el código del certificado en la URL. Probá con verify.html?id=ACG-000000003");
        return;
      }

      const { data, error } = await supabaseClient
        .from("certificates")
        .select("*")
        .eq("certificate_id", id)
        .single();

      if (error || !data) {
        console.error(error);
        renderNotFound("No encontramos ningún certificado con el código " + id + ".");
        return;
      }

      renderCertificate(mapSupabaseCertificate(data));
    }

    function setupHeaderSearch() {
      const headerForm = document.getElementById("headerSearchForm");
      const headerInput = document.getElementById("headerCertInput");
      if (!headerForm || !headerInput) return;
      headerForm.addEventListener("submit", function(event) {
        event.preventDefault();
        const code = headerInput.value.trim().toUpperCase();
        if (!code) {
          alert("Ingresá un número de certificado.");
          return;
        }
        window.location.href = "verify.html?id=" + encodeURIComponent(code);
      });
    }

    setupHeaderSearch();
    loadCertificate();
  </script>
</body>
