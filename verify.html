<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>APEX Card Grading | Certificado</title>
  <meta name="description" content="Verificación de certificado APEX Card Grading." />

  <link rel="icon" type="image/png" href="assets/icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050505;
      --bg-soft:#0d0d0f;
      --card:rgba(255,255,255,0.04);
      --line:rgba(255,255,255,0.10);
      --line-strong:rgba(255,255,255,0.18);
      --white:#f7f7f7;
      --muted:#a1a1aa;
      --shadow:0 20px 60px rgba(0,0,0,.32);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:"Inter", sans-serif;
      color:var(--white);
      background:
        linear-gradient(180deg, #08090d, #0d1017);
    }

    a{ color:inherit; text-decoration:none; }
    img{ max-width:100%; display:block; }

    .bg-grid{
      position:fixed;
      inset:0;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size:36px 36px;
      mask-image:radial-gradient(circle at center, rgba(0,0,0,1), rgba(0,0,0,.1));
      pointer-events:none;
      z-index:-1;
    }

    .container{
      width:min(1280px, 92vw);
      margin:0 auto;
    }

    /* HEADER */
    .site-header{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(5,5,5,.78);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
    }

    .nav-wrap{
      min-height:84px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }

    .brand-logo{
      height:80px;
      width:auto;
    }

    .nav{
      display:flex;
      gap:22px;
      align-items:center;
    }

    .nav a{
      color:#d8d8d8;
      font-size:.96rem;
    }

    .nav a:hover{
      color:#fff;
    }

    /* PAGE */
    .verify-page{
      padding:42px 0 80px;
    }

    .verify-status{
      display:inline-flex;
      align-items:center;
      gap:10px;
      border:1px solid var(--line);
      background:rgba(255,255,255,0.05);
      border-radius:999px;
      padding:10px 16px;
      margin-bottom:24px;
      font-weight:700;
      color:var(--white);
    }

    .verify-layout{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:30px;
      align-items:start;
    }

    .panel{
      border-radius:30px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:var(--shadow);
    }

    /* LEFT */
    .visual-panel{
      min-height:760px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .visual-panel img,
    .visual-panel video{
      width:100%;
      height:100%;
      object-fit:contain;
      filter:drop-shadow(0 40px 100px rgba(0,0,0,0.8));
    }

    /* RIGHT */
    .content-panel{
      padding:30px;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .eyebrow{
      font-size:12px;
      letter-spacing:2px;
      color:#aaa;
      text-transform:uppercase;
    }

    .title-row{
      display:flex;
      justify-content:space-between;
      gap:20px;
      align-items:flex-start;
    }

    .card-title{
      font-size:56px;
      font-weight:900;
      margin:0;
      line-height:1;
      letter-spacing:-0.05em;
    }

    .card-meta{
      margin-top:10px;
      color:#ccc;
      line-height:1.65;
    }

    .grade-box{
      padding:20px;
      border-radius:22px;
      background:rgba(255,255,255,0.05);
      text-align:center;
      min-width:220px;
      border:1px solid rgba(255,255,255,0.08);
    }

    .grade-label{
      font-size:12px;
      color:#aaa;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .grade-value{
      font-size:46px;
      font-weight:900;
      line-height:1.05;
      margin-top:6px;
    }

    .grade-average{
      margin-top:6px;
      color:#d0d0d5;
      font-size:.95rem;
    }

    .meta-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .meta-card{
      padding:16px;
      border-radius:18px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      line-height:1.6;
    }

    .meta-card b{
      display:block;
      margin-bottom:6px;
      font-size:.82rem;
      letter-spacing:.10em;
      color:#aaa;
    }

    .subgrades-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:15px;
    }

    .subgrade-card{
      text-align:center;
      padding:15px;
      border-radius:18px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
    }

    .subgrade-label{
      color:#aaa;
      font-size:.82rem;
      text-transform:uppercase;
      letter-spacing:.10em;
    }

    .subgrade-value{
      display:block;
      font-size:30px;
      font-weight:900;
      margin-top:8px;
    }

    .text-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .text-card{
      padding:20px;
      border-radius:18px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      line-height:1.7;
      color:#d0d0d5;
    }

    .text-card b{
      display:block;
      margin-bottom:10px;
      color:var(--white);
    }

    /* EXTRA SECTIONS */
    .section-block{
      margin-top:30px;
      padding:26px;
    }

    .section-title{
      margin:0 0 18px;
      font-size:1.45rem;
      letter-spacing:-0.03em;
    }

    .zoom-group{
      display:grid;
      gap:18px;
    }

    .zoom-subtitle{
      font-size:.9rem;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#aaa;
      margin:0 0 10px;
    }

    .zoom-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:14px;
    }

    .zoom-card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:18px;
      overflow:hidden;
    }

    .zoom-card img{
      width:100%;
      aspect-ratio:1 / 1;
      object-fit:cover;
    }

    .zoom-card span{
      display:block;
      padding:10px 12px;
      font-size:.88rem;
      color:#d8d8de;
      text-align:center;
    }

    .micro-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:14px;
    }

    .micro-card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:18px;
      overflow:hidden;
    }

    .micro-card img{
      width:100%;
      aspect-ratio:1 / 1;
      object-fit:cover;
    }

    .micro-card span{
      display:block;
      padding:10px 12px;
      font-size:.88rem;
      color:#d8d8de;
      text-align:center;
    }

    .not-found{
      max-width:700px;
      margin:80px auto;
      text-align:center;
      padding:40px;
      border-radius:28px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
    }

    .not-found h1{
      margin:0 0 14px;
      font-size:2rem;
    }

    .not-found p{
      margin:0;
      color:#c9c9d0;
      line-height:1.7;
    }

    @media (max-width: 1100px){
      .verify-layout{
        grid-template-columns:1fr;
      }

      .title-row{
        flex-direction:column;
      }

      .grade-box{
        width:100%;
      }
    }

    @media (max-width: 900px){
      .subgrades-grid,
      .text-grid,
      .zoom-grid,
      .micro-grid,
      .meta-grid{
        grid-template-columns:1fr 1fr;
      }

      .card-title{
        font-size:42px;
      }
    }

    @media (max-width: 640px){
      .nav{
        display:none;
      }

      .brand-logo{
        height:38px;
      }

      .subgrades-grid,
      .text-grid,
      .zoom-grid,
      .micro-grid,
      .meta-grid{
        grid-template-columns:1fr;
      }

      .visual-panel{
        min-height:auto;
      }
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>

  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html#top" class="brand">
        <img src="assets/Logo-Apex .png" alt="APEX Card Grading" class="brand-logo" />
      </a>

      <nav class="nav">
        <a href="index.html#proceso">Proceso</a>
        <a href="index.html#escala">Escala</a>
        <a href="index.html#precios">Precios</a>
        <a href="index.html#contacto">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="verify-page">
    <div class="container">
      <div id="certContainer">Cargando...</div>
    </div>
  </main>

  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const container = document.getElementById("certContainer");

    function renderZoomSection(cert){
      if (!cert.zoomImages) return "";

      const front = cert.zoomImages.front || {};
      const back = cert.zoomImages.back || {};

      const hasFront = front.topLeft || front.topRight || front.bottomLeft || front.bottomRight;
      const hasBack = back.topLeft || back.topRight || back.bottomLeft || back.bottomRight;

      if (!hasFront && !hasBack) return "";

      return `
        <section class="panel section-block">
          <h2 class="section-title">Zoom de esquinas</h2>

          <div class="zoom-group">
            ${hasFront ? `
              <div>
                <p class="zoom-subtitle">Frente</p>
                <div class="zoom-grid">
                  ${front.topLeft ? `<div class="zoom-card"><img src="${front.topLeft}" alt="Esquina superior izquierda frente"><span>Superior izquierda</span></div>` : ""}
                  ${front.topRight ? `<div class="zoom-card"><img src="${front.topRight}" alt="Esquina superior derecha frente"><span>Superior derecha</span></div>` : ""}
                  ${front.bottomLeft ? `<div class="zoom-card"><img src="${front.bottomLeft}" alt="Esquina inferior izquierda frente"><span>Inferior izquierda</span></div>` : ""}
                  ${front.bottomRight ? `<div class="zoom-card"><img src="${front.bottomRight}" alt="Esquina inferior derecha frente"><span>Inferior derecha</span></div>` : ""}
                </div>
              </div>
            ` : ""}

            ${hasBack ? `
              <div>
                <p class="zoom-subtitle">Reverso</p>
                <div class="zoom-grid">
                  ${back.topLeft ? `<div class="zoom-card"><img src="${back.topLeft}" alt="Esquina superior izquierda reverso"><span>Superior izquierda</span></div>` : ""}
                  ${back.topRight ? `<div class="zoom-card"><img src="${back.topRight}" alt="Esquina superior derecha reverso"><span>Superior derecha</span></div>` : ""}
                  ${back.bottomLeft ? `<div class="zoom-card"><img src="${back.bottomLeft}" alt="Esquina inferior izquierda reverso"><span>Inferior izquierda</span></div>` : ""}
                  ${back.bottomRight ? `<div class="zoom-card"><img src="${back.bottomRight}" alt="Esquina inferior derecha reverso"><span>Inferior derecha</span></div>` : ""}
                </div>
              </div>
            ` : ""}
          </div>
        </section>
      `;
    }

    function renderMicroscopeSection(cert){
      if (!cert.microscopeImages || !cert.microscopeImages.length) return "";

      return `
        <section class="panel section-block">
          <h2 class="section-title">Capturas de microscopio</h2>
          <div class="micro-grid">
            ${cert.microscopeImages.map(item => `
              <div class="micro-card">
                <img src="${item.src}" alt="${item.label || "Captura de microscopio"}">
                <span>${item.label || "Detalle técnico"}</span>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    if (!id || !window.certificates || !window.certificates[id]) {
      container.innerHTML = `
        <div class="not-found">
          <h1>Certificado no encontrado</h1>
          <p>Revisá que el código ingresado sea correcto o volvé al buscador principal.</p>
        </div>
      `;
    } else {
      const cert = window.certificates[id];

      container.innerHTML = `
        <div class="verify-status">${cert.status}</div>

        <div class="verify-layout">
          <div class="panel visual-panel">
            ${cert.video
              ? `<video src="${cert.video}" autoplay muted loop playsinline></video>`
              : `<img src="${cert.image}" alt="${cert.cardDetails.name}">`
            }
          </div>

          <div class="panel content-panel">
            <div class="eyebrow">Official Certificate Record</div>

            <div class="title-row">
              <div>
                <h1 class="card-title">${cert.cardDetails.name}</h1>
                <div class="card-meta">
                  ${cert.cardDetails.year} ${cert.cardDetails.brand}<br>
                  ${cert.cardDetails.set}<br>
                  ${cert.cardDetails.number}
                </div>
              </div>

              <div class="grade-box">
                <div class="grade-label">Final Grade</div>
                <div class="grade-value">${cert.finalGrade}</div>
                <div class="grade-average">Average ${cert.averageScore}</div>
              </div>
            </div>

            <div class="meta-grid">
              <div class="meta-card">
                <b>Certificate ID</b>
                ${cert.certificateId}
              </div>

              <div class="meta-card">
                <b>Status</b>
                ${cert.status}
              </div>
            </div>

            <div class="subgrades-grid">
              <div class="subgrade-card">
                <span class="subgrade-label">Surface</span>
                <span class="subgrade-value">${cert.subgrades.surface}</span>
              </div>

              <div class="subgrade-card">
                <span class="subgrade-label">Corners</span>
                <span class="subgrade-value">${cert.subgrades.corners}</span>
              </div>

              <div class="subgrade-card">
                <span class="subgrade-label">Edges</span>
                <span class="subgrade-value">${cert.subgrades.edges}</span>
              </div>

              <div class="subgrade-card">
                <span class="subgrade-label">Centering</span>
                <span class="subgrade-value">${cert.subgrades.centering}</span>
              </div>
            </div>

            <div class="text-grid">
              <div class="text-card">
                <b>Technical Assessment</b>
                ${cert.technicalAssessment}
              </div>

              <div class="text-card">
                <b>Security Notice</b>
                ${cert.securityNotice}
              </div>
            </div>
          </div>
        </div>

        ${renderZoomSection(cert)}
        ${renderMicroscopeSection(cert)}
      `;
    }
  </script>
</body>
</html>
