<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>APEX Card Grading | Certificado</title>
  <meta name="description" content="Verificación de certificado APEX Card Grading." />

  <link rel="icon" type="image/png" href="assets/icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050505;
      --bg-soft:#0d0d0f;
      --card:rgba(255,255,255,0.04);
      --line:rgba(255,255,255,0.10);
      --line-strong:rgba(255,255,255,0.18);
      --white:#f7f7f7;
      --muted:#a1a1aa;
      --shadow:0 20px 60px rgba(0,0,0,.32);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:"Inter", sans-serif;
      color:var(--white);
      background:linear-gradient(180deg, #08090d, #0d1017);
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img,
    video{
      max-width:100%;
      display:block;
    }

    .bg-grid{
      position:fixed;
      inset:0;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size:36px 36px;
      mask-image:radial-gradient(circle at center, rgba(0,0,0,1), rgba(0,0,0,.1));
      pointer-events:none;
      z-index:-1;
    }

    .container{
      width:min(1280px, 92vw);
      margin:0 auto;
    }

    /* HEADER */
    .site-header{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(5,5,5,.78);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
    }

    .nav-wrap{
      min-height:84px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .brand-logo{
      height:80px;
      width:auto;
    }

    .nav{
      display:flex;
      gap:22px;
      align-items:center;
    }

    .nav a{
      color:#d8d8d8;
      font-size:.96rem;
    }

    .nav a:hover{
      color:#fff;
    }

    /* BUSCADOR HEADER */
    .header-search{
      display:flex;
      align-items:center;
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      background:rgba(255,255,255,0.05);
      transition:.2s ease;
    }

    .header-search:focus-within{
      border-color:rgba(255,255,255,0.25);
      box-shadow:0 0 0 3px rgba(255,255,255,0.05);
    }

    #headerCertInput{
      height:44px;
      width:220px;
      padding:0 14px;
      border:none;
      background:transparent;
      color:#fff;
      font-size:.9rem;
      outline:none;
    }

    #headerCertInput::placeholder{
      color:rgba(255,255,255,0.4);
    }

    .header-search-btn{
      height:44px;
      padding:0 16px;
      border:none;
      border-left:1px solid var(--line);
      background:#fff;
      color:#000;
      font-weight:600;
      font-size:.9rem;
      cursor:pointer;
      transition:.2s ease;
    }

    .header-search-btn:hover{
      background:#eaeaea;
    }

    /* PAGE */
    .verify-page{
      padding:42px 0 80px;
    }

    .verify-status{
      display:inline-flex;
      align-items:center;
      gap:10px;
      border:1px solid var(--line);
      background:rgba(255,255,255,0.05);
      border-radius:999px;
      padding:10px 16px;
      margin-bottom:24px;
      font-weight:700;
      color:var(--white);
    }

    .verify-layout{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:30px;
      align-items:start;
    }

    .panel{
      border-radius:30px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:var(--shadow);
    }

    /* LEFT */
    .visual-panel{
      min-height:760px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .visual-panel img,
    .visual-panel video{
      width:100%;
      height:100%;
      object-fit:contain;
      filter:drop-shadow(0 40px 100px rgba(0,0,0,0.8));
    }

    /* RIGHT */
    .content-panel{
      padding:30px;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .eyebrow{
      font-size:12px;
      letter-spacing:2px;
      color:#aaa;
      text-transform:uppercase;
    }

    .title-row{
      display:flex;
      justify-content:space-between;
      gap:20px;
      align-items:flex-start;
    }

    .card-title{
      font-size:56px;
      font-weight:900;
      margin:0;
      line-height:1;
      letter-spacing:-0.05em;
    }

    .card-meta{
      margin-top:10px;
      color:#ccc;
      line-height:1.65;
    }

    .grade-box{
      padding:20px;
      border-radius:22px;
      background:rgba(255,255,255,0.05);
      text-align:center;
      min-width:220px;
      border:1px solid rgba(255,255,255,0.08);
    }

    .grade-label{
      font-size:12px;
      color:#aaa;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .grade-value{
      font-size:46px;
      font-weight:900;
      line-height:1.05;
      margin-top:6px;
    }

    .grade-average{
      margin-top:6px;
      color:#d0d0d5;
      font-size:.95rem;
    }

    .meta-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .meta-card{
      padding:16px;
      border-radius:18px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      line-height:1.6;
    }

    .meta-card b{
      display:block;
      margin-bottom:6px;
      font-size:.82rem;
      letter-spacing:.10em;
      color:#aaa;
    }

    .subgrades-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:15px;
    }

    .subgrade-card{
      text-align:center;
      padding:15px;
      border-radius:18px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
    }

    .subgrade-label{
      color:#aaa;
      font-size:.82rem;
      text-transform:uppercase;
      letter-spacing:.10em;
    }

    .subgrade-value{
      display:block;
      font-size:30px;
      font-weight:900;
      margin-top:8px;
    }

    .text-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .text-card{
      padding:20px;
      border-radius:18px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      line-height:1.7;
      color:#d0d0d5;
    }

    .text-card b{
      display:block;
      margin-bottom:10px;
      color:var(--white);
    }

    /* EXTRA SECTIONS */
    .section-block{
      margin-top:30px;
      padding:26px;
    }

    .section-title{
      margin:0 0 18px;
      font-size:1.45rem;
      letter-spacing:-0.03em;
    }

    /* Centering */
    .centering-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .centering-card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:18px;
      overflow:hidden;
    }

    .centering-card img{
      width:100%;
      aspect-ratio:0.714 / 1;
      object-fit:cover;
    }

    .centering-card span{
      display:block;
      padding:10px 12px;
      text-align:center;
      color:#d8d8de;
      font-size:.9rem;
    }

    /* Zoom / Corners */
    .zoom-group{
      display:grid;
      gap:18px;
    }

    .zoom-subtitle{
      font-size:.9rem;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:#aaa;
      margin:0 0 10px;
    }

    .zoom-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:14px;
    }

    .corner-analysis-card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:20px;
      overflow:hidden;
    }

    .corner-image-wrap{
      position:relative;
      background:#111;
    }

    .corner-image-wrap img{
      width:100%;
      aspect-ratio:1 / 1;
      object-fit:cover;
    }

    .corner-topbar{
      position:absolute;
      top:10px;
      left:12px;
      right:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:3;
    }

    .corner-title{
      font-size:.8rem;
      font-weight:800;
      color:#000000;
      letter-spacing:.08em;
    }

    .corner-score{
      font-size:.95rem;
      font-weight:900;
      color:#ff0000;
    }

  

    .corner-metrics{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:12px;
      border-top:1px solid rgba(255,255,255,0.06);
    }

    .corner-metric{
      padding:6px 10px;
      border-radius:999px;
      background:rgba(0,255,170,0.12);
      border:1px solid rgba(0,255,170,0.18);
      color:#7ef7d0;
      font-size:.78rem;
      font-weight:700;
    }

    .corner-defects{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:0 12px 12px;
    }

    .corner-defect{
      padding:6px 10px;
      border-radius:10px;
      background:rgba(255,196,0,0.10);
      border:1px solid rgba(255,196,0,0.18);
      color:#f3c34a;
      font-size:.76rem;
      font-weight:700;
    }

    /* Microscopio */
    .micro-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:14px;
    }

    .micro-analysis-card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:20px;
      overflow:hidden;
    }

    .micro-image-wrap{
      position:relative;
      background:#111;
    }

    .micro-image-wrap img{
      width:100%;
      aspect-ratio:1 / 1;
      object-fit:cover;
    }

    .micro-topbar{
      position:absolute;
      top:10px;
      left:12px;
      right:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:3;
    }

    .micro-title{
      font-size:.8rem;
      font-weight:800;
      color:#f3f3f3;
      letter-spacing:.08em;
    }

    .micro-score{
      font-size:.95rem;
      font-weight:900;
      color:#ffd34d;
    }

    .micro-metrics{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:12px;
      border-top:1px solid rgba(255,255,255,0.06);
    }

    .micro-metric{
      padding:6px 10px;
      border-radius:999px;
      background:rgba(0,255,170,0.12);
      border:1px solid rgba(0,255,170,0.18);
      color:#7ef7d0;
      font-size:.78rem;
      font-weight:700;
    }

    .micro-defects{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:0 12px 12px;
    }

    .micro-defect{
      padding:6px 10px;
      border-radius:10px;
      background:rgba(255,196,0,0.10);
      border:1px solid rgba(255,196,0,0.18);
      color:#f3c34a;
      font-size:.76rem;
      font-weight:700;
    }

    /* Edges */
    .edge-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .edge-analysis-card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.07);
      border-radius:20px;
      overflow:hidden;
    }

    .edge-image-wrap{
      position:relative;
      background:#111;
    }

    .edge-image-wrap img{
      width:100%;
      aspect-ratio:16 / 5;
      object-fit:cover;
    }

    .edge-topbar{
      position:absolute;
      top:10px;
      left:12px;
      right:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:3;
    }

    .edge-title{
      font-size:.82rem;
      font-weight:800;
      color:#000000;
      letter-spacing:.08em;
    }

    .edge-score{
      font-size:.95rem;
      font-weight:900;
      color:#ff0000;
    }

    .edge-metrics{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:12px;
      border-top:1px solid rgba(255,255,255,0.06);
    }

    .edge-metric{
      padding:6px 10px;
      border-radius:999px;
      background:rgba(0,255,170,0.12);
      border:1px solid rgba(0,255,170,0.18);
      color:#7ef7d0;
      font-size:.78rem;
      font-weight:700;
    }

    .edge-defects{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:0 12px 12px;
    }

    .edge-defect{
      padding:6px 10px;
      border-radius:10px;
      background:rgba(255,196,0,0.10);
      border:1px solid rgba(255,196,0,0.18);
      color:#f3c34a;
      font-size:.76rem;
      font-weight:700;
    }

    .not-found{
      max-width:700px;
      margin:80px auto;
      text-align:center;
      padding:40px;
      border-radius:28px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
    }

    .not-found h1{
      margin:0 0 14px;
      font-size:2rem;
    }

    .not-found p{
      margin:0;
      color:#c9c9d0;
      line-height:1.7;
    }

    @media (max-width: 1100px){
      .verify-layout{
        grid-template-columns:1fr;
      }

      .title-row{
        flex-direction:column;
      }

      .grade-box{
        width:100%;
      }
    }

    @media (max-width: 900px){
      .subgrades-grid,
      .text-grid,
      .zoom-grid,
      .micro-grid,
      .meta-grid,
      .centering-grid,
      .edge-grid{
        grid-template-columns:1fr 1fr;
      }

      .card-title{
        font-size:42px;
      }
    }

    @media (max-width: 640px){
      .nav{
        display:none;
      }

      .brand-logo{
        height:38px;
      }

      .header-search{
        width:100%;
      }

      #headerCertInput{
        width:100%;
      }

      .subgrades-grid,
      .text-grid,
      .zoom-grid,
      .micro-grid,
      .meta-grid,
      .centering-grid,
      .edge-grid{
        grid-template-columns:1fr;
      }

      .visual-panel{
        min-height:auto;
      }
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>

  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html#top" class="brand">
        <img src="assets/Logo-Apex .png" alt="APEX Card Grading" class="brand-logo" />
      </a>

      <nav class="nav">
        <a href="index.html#escala">Escala</a>
        <a href="index.html#proceso">Proceso</a>
        <a href="index.html#precios">Precios</a>
        <a href="index.html#consultas">Consultas</a>
        <a href="index.html#contacto">Contacto</a>
      </nav>

      <form class="header-search" id="headerSearchForm">
        <input
          type="text"
          id="headerCertInput"
          placeholder="Ingresá tu código ACG"
          aria-label="Buscar certificado"
        />
        <button type="submit" class="header-search-btn">Buscar</button>
      </form>
    </div>
  </header>

  <main class="verify-page">
    <div class="container">
      <div id="certContainer">Cargando...</div>
    </div>
  </main>

  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const container = document.getElementById("certContainer");

    function normalizeCorner(corner){
      if (!corner) return null;
      if (typeof corner === "string") {
        return { src: corner };
      }
      return corner;
    }

    function renderCentering(cert){
      if (!cert.centeringImages) return "";

      return `
        <section class="panel section-block">
          <h2 class="section-title">Análisis de centrado</h2>
          <div class="centering-grid">
            <div class="centering-card">
              <img src="${cert.centeringImages.front}" alt="Centering frente">
              <span>Frente</span>
            </div>
            <div class="centering-card">
              <img src="${cert.centeringImages.back}" alt="Centering dorso">
              <span>Dorso</span>
            </div>
          </div>
        </section>
      `;
    }

    function renderCornerCard(corner, fallbackTitle) {
      const item = normalizeCorner(corner);
      if (!item || !item.src) return "";

      const metrics = (item.metrics || [])
        .map(metric => `<span class="corner-metric">${metric.label} ${metric.value}</span>`)
        .join("");

      const defects = (item.defects || [])
        .map(defect => `<span class="corner-defect">${defect}</span>`)
        .join("");

      return `
        <div class="corner-analysis-card">
          <div class="corner-image-wrap">
            <img src="${item.src}" alt="${item.title || fallbackTitle}">

            <div class="corner-topbar">
              <span class="corner-title">${item.title || fallbackTitle}</span>
              ${item.score ? `<span class="corner-score">${item.score}</span>` : ""}
            </div>

            ${item.overlays && item.overlays.hLine ? `<span class="corner-line-h"></span>` : ""}
            ${item.overlays && item.overlays.vLine ? `<span class="corner-line-v"></span>` : ""}
          </div>

          ${metrics ? `<div class="corner-metrics">${metrics}</div>` : ""}
          ${defects ? `<div class="corner-defects">${defects}</div>` : ""}
        </div>
      `;
    }

    function renderZoomSection(cert){
      if (!cert.zoomImages) return "";

      const front = cert.zoomImages.front || {};
      const back = cert.zoomImages.back || {};

      const hasFront = front.topLeft || front.topRight || front.bottomLeft || front.bottomRight;
      const hasBack = back.topLeft || back.topRight || back.bottomLeft || back.bottomRight;

      if (!hasFront && !hasBack) return "";

      return `
        <section class="panel section-block">
          <h2 class="section-title">Zoom de esquinas</h2>

          <div class="zoom-group">
            ${hasFront ? `
              <div>
                <p class="zoom-subtitle">Frente</p>
                <div class="zoom-grid">
                  ${renderCornerCard(front.topLeft, "TOP LEFT")}
                  ${renderCornerCard(front.topRight, "TOP RIGHT")}
                  ${renderCornerCard(front.bottomLeft, "BOTTOM LEFT")}
                  ${renderCornerCard(front.bottomRight, "BOTTOM RIGHT")}
                </div>
              </div>
            ` : ""}

            ${hasBack ? `
              <div>
                <p class="zoom-subtitle">Reverso</p>
                <div class="zoom-grid">
                  ${renderCornerCard(back.topLeft, "TOP LEFT")}
                  ${renderCornerCard(back.topRight, "TOP RIGHT")}
                  ${renderCornerCard(back.bottomLeft, "BOTTOM LEFT")}
                  ${renderCornerCard(back.bottomRight, "BOTTOM RIGHT")}
                </div>
              </div>
            ` : ""}
          </div>
        </section>
      `;
    }

    function renderMicroscopeCard(item) {
      if (!item || !item.src) return "";

      const metrics = (item.metrics || [])
        .map(metric => `<span class="micro-metric">${metric.label} ${metric.value}</span>`)
        .join("");

      const defects = (item.defects || [])
        .map(defect => `<span class="micro-defect">${defect}</span>`)
        .join("");

      return `
        <div class="micro-analysis-card">
          <div class="micro-image-wrap">
            <img src="${item.src}" alt="${item.title || item.label || "Captura de microscopio"}">

            <div class="micro-topbar">
              <span class="micro-title">${item.title || item.label || "DETAIL"}</span>
              ${item.score ? `<span class="micro-score">${item.score}</span>` : ""}
            </div>
          </div>

          ${metrics ? `<div class="micro-metrics">${metrics}</div>` : ""}
          ${defects ? `<div class="micro-defects">${defects}</div>` : ""}
        </div>
      `;
    }

    function renderMicroscopeSection(cert){
      if (!cert.microscopeImages || !cert.microscopeImages.length) return "";

      return `
        <section class="panel section-block">
          <h2 class="section-title">Capturas de microscopio</h2>
          <div class="micro-grid">
            ${cert.microscopeImages.map(item => renderMicroscopeCard(item)).join("")}
          </div>
        </section>
      `;
    }

    function renderEdgeCard(edge, fallbackTitle) {
      if (!edge || !edge.src) return "";

      const metrics = (edge.metrics || [])
        .map(item => `<span class="edge-metric">${item.label} ${item.value}</span>`)
        .join("");

      const defects = (edge.defects || [])
        .map(item => `<span class="edge-defect">${item}</span>`)
        .join("");

      return `
        <div class="edge-analysis-card">
          <div class="edge-image-wrap">
            <img src="${edge.src}" alt="${edge.title || fallbackTitle}">
            <div class="edge-topbar">
              <span class="edge-title">${edge.title || fallbackTitle}</span>
              ${edge.score ? `<span class="edge-score">${edge.score}</span>` : ""}
            </div>
          </div>

          ${metrics ? `<div class="edge-metrics">${metrics}</div>` : ""}
          ${defects ? `<div class="edge-defects">${defects}</div>` : ""}
        </div>
      `;
    }

    function renderEdgesSection(cert) {
      if (!cert.edgeImages) return "";

      const front = cert.edgeImages.front || {};
      const back = cert.edgeImages.back || {};

      const hasFront = front.top || front.bottom || front.left || front.right;
      const hasBack = back.top || back.bottom || back.left || back.right;

      if (!hasFront && !hasBack) return "";

      return `
        <section class="panel section-block">
          <h2 class="section-title">Análisis de bordes</h2>

          <div class="zoom-group">
            ${hasFront ? `
              <div>
                <p class="zoom-subtitle">Front Edges</p>
                <div class="edge-grid">
                  ${renderEdgeCard(front.top, "TOP")}
                  ${renderEdgeCard(front.bottom, "BOTTOM")}
                  ${renderEdgeCard(front.left, "LEFT")}
                  ${renderEdgeCard(front.right, "RIGHT")}
                </div>
              </div>
            ` : ""}

            ${hasBack ? `
              <div>
                <p class="zoom-subtitle">Back Edges</p>
                <div class="edge-grid">
                  ${renderEdgeCard(back.top, "TOP")}
                  ${renderEdgeCard(back.bottom, "BOTTOM")}
                  ${renderEdgeCard(back.left, "LEFT")}
                  ${renderEdgeCard(back.right, "RIGHT")}
                </div>
              </div>
            ` : ""}
          </div>
        </section>
      `;
    }

    if (!id || !window.certificates || !window.certificates[id]) {
      container.innerHTML = `
        <div class="not-found">
          <h1>Certificado no encontrado</h1>
          <p>Revisá que el código ingresado sea correcto o volvé al buscador principal.</p>
        </div>
      `;
    } else {
      const cert = window.certificates[id];

      container.innerHTML = `
        <div class="verify-status">${cert.status}</div>

        <div class="verify-layout">
          <div class="panel visual-panel">
            ${cert.video
              ? `<video src="${cert.video}" autoplay muted loop playsinline></video>`
              : `<img src="${cert.image}" alt="${cert.cardDetails.name}">`
            }
          </div>

          <div class="panel content-panel">
            <div class="eyebrow">Official Certificate Record</div>

            <div class="title-row">
              <div>
                <h1 class="card-title">${cert.cardDetails.name}</h1>
                <div class="card-meta">
                  ${cert.cardDetails.year} ${cert.cardDetails.brand}<br>
                  ${cert.cardDetails.set}<br>
                  ${cert.cardDetails.number}
                </div>
              </div>

              <div class="grade-box">
                <div class="grade-label">Final Grade</div>
                <div class="grade-value">${cert.finalGrade}</div>
                <div class="grade-average">Average ${cert.averageScore}</div>
              </div>
            </div>

            <div class="meta-grid">
              <div class="meta-card">
                <b>Certificate ID</b>
                ${cert.certificateId}
              </div>

              <div class="meta-card">
                <b>Status</b>
                ${cert.status}
              </div>
            </div>

            <div class="subgrades-grid">
              <div class="subgrade-card">
                <span class="subgrade-label">Surface</span>
                <span class="subgrade-value">${cert.subgrades.surface}</span>
              </div>

              <div class="subgrade-card">
                <span class="subgrade-label">Corners</span>
                <span class="subgrade-value">${cert.subgrades.corners}</span>
              </div>

              <div class="subgrade-card">
                <span class="subgrade-label">Edges</span>
                <span class="subgrade-value">${cert.subgrades.edges}</span>
              </div>

              <div class="subgrade-card">
                <span class="subgrade-label">Centering</span>
                <span class="subgrade-value">${cert.subgrades.centering}</span>
              </div>
            </div>

            <div class="text-grid">
              <div class="text-card">
                <b>Technical Assessment</b>
                ${cert.technicalAssessment}
              </div>

              <div class="text-card">
                <b>Security Notice</b>
                ${cert.securityNotice}
              </div>
            </div>
          </div>
        </div>

        ${renderCentering(cert)}
        ${renderZoomSection(cert)}
        ${renderMicroscopeSection(cert)}
        ${renderEdgesSection(cert)}
      `;
    }

    const headerForm = document.getElementById("headerSearchForm");
    const headerInput = document.getElementById("headerCertInput");

    if (headerForm && headerInput) {
      headerForm.addEventListener("submit", function(event){
        event.preventDefault();

        const code = headerInput.value.trim();

        if (!code) {
          alert("Ingresá un número de certificado.");
          return;
        }

        if (window.certificates && window.certificates[code]) {
          window.location.href = "verify.html?id=" + encodeURIComponent(code);
        } else {
          alert("Certificado no encontrado.");
        }
      });
    }
  </script>
</body>
</html>
